server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: xy-material-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xy_material?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:xy}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:10}
      minimum-idle: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    dir: ${APP_STORAGE_DIR:./uploads}
  simulation:
    fail-stage: ${APP_SIMULATION_FAIL_STAGE:NONE}
    stage-delay-ms: ${APP_SIMULATION_STAGE_DELAY_MS:3000}
    dev-api-enabled: ${APP_SIMULATION_DEV_API_ENABLED:false}
  task-executor:
    core-size: ${APP_TASK_EXECUTOR_CORE_SIZE:2}
    max-size: ${APP_TASK_EXECUTOR_MAX_SIZE:2}
    queue-capacity: ${APP_TASK_EXECUTOR_QUEUE_CAPACITY:100}
  files:
    signing-secret: ${APP_FILES_SIGNING_SECRET:}

logging:
  level:
    com.xy.material: INFO
